<div class="min-h-screen bg-slate-50 flex flex-col justify-center py-12 sm:px-6 lg:px-8">
  <div class="sm:mx-auto w-full sm:max-w-md">
    <div class="flex justify-center mb-4">
      <div class="bg-blue-600 text-white p-3 rounded-2xl shadow-lg shadow-blue-200">
        <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4" />
        </svg>
      </div>
    </div>
    <h2 class="text-center text-3xl font-extrabold tracking-tight text-slate-900">
      Control de Inventario
    </h2>
    <p class="mt-2 text-center text-sm text-slate-500">
      Ingresa tus credenciales para acceder al panel
    </p>
  </div>

  <div class="mt-8 sm:mx-auto w-full sm:max-w-md px-4 sm:px-0">
    <div class="bg-white py-8 px-6 sm:px-10 rounded-3xl shadow-xl shadow-slate-200/60 border border-slate-200">
      <form class="space-y-6">

        <div>
          <label for="email" class="block text-sm font-bold text-slate-700 mb-1 ml-1">
            Correo Electrónico
          </label>
          <div class="relative">
            <span class="absolute left-4 top-1/2 -translate-y-1/2 text-slate-400">
              <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                  d="M16 12a4 4 0 10-8 0 4 4 0 008 0zm0 0v1.5a2.5 2.5 0 005 0V12a9 9 0 10-9 9m4.5-1.206a8.959 8.959 0 01-4.5 1.206" />
              </svg>
            </span>
            <input id="email" type="email" autocomplete="email" placeholder="usuario@empresa.com"
              class="w-full pl-11 pr-4 py-2.5 rounded-xl border border-slate-200 focus:ring-4 focus:ring-blue-500/10 focus:border-blue-500 outline-none transition-all placeholder:text-slate-400 text-slate-700" />
          </div>
        </div>

        <div>
          <div class="flex items-center justify-between mb-1 ml-1">
            <label for="password" class="block text-sm font-bold text-slate-700">
              Contraseña
            </label>
            <div class="text-sm">
              <a routerLink="/restore-password"
                class="font-semibold text-blue-600 hover:text-blue-700 transition-colors">
                ¿La olvidaste?
              </a>
            </div>
          </div>
          <div class="relative">
            <span class="absolute left-4 top-1/2 -translate-y-1/2 text-slate-400">
              <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                  d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" />
              </svg>
            </span>
            <input id="password" type="password" autocomplete="current-password" placeholder="••••••••"
              class="w-full pl-11 pr-4 py-2.5 rounded-xl border border-slate-200 focus:ring-4 focus:ring-blue-500/10 focus:border-blue-500 outline-none transition-all placeholder:text-slate-400 text-slate-700" />
          </div>
        </div>

        <div class="flex items-center ml-1">
          <input id="remember-me" type="checkbox"
            class="h-4 w-4 text-blue-600 focus:ring-blue-500 border-slate-300 rounded-lg transition-all" />
          <label for="remember-me" class="ml-2 block text-sm font-semibold text-slate-600 select-none">
            Mantener sesión activa
          </label>
        </div>

        <div>
          <button type="submit" (click)="login()"
            class="w-full flex justify-center items-center gap-2 bg-blue-600 hover:bg-blue-700 text-white py-2.5 rounded-xl font-bold shadow-lg shadow-blue-200 transition-all active:scale-[0.98]">
            Ingresar al Panel
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3" />
            </svg>
          </button>
        </div>
      </form>
    </div>
  </div>
</div>
