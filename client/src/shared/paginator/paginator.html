<div class="flex flex-col sm:flex-row items-center justify-between w-full gap-4 py-3 bg-white">

  <div class="flex items-center gap-3">
    <span class="text-sm font-medium text-gray-600">Mostrar:</span>
    <div class="relative">
      <select
        class="appearance-none bg-white border border-gray-300 text-gray-700 py-1.5 pl-3 pr-8 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 cursor-pointer transition-all hover:border-gray-400"
        (change)="onPageChange(undefined, $event.target)">
        @for (size of pageSizeOptions(); track $index) {
        <option [value]="size" [selected]="size === pageSize()">{{size}} registros</option>
        }
      </select>
      <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-2 text-gray-500">
        <svg class="h-4 w-4 fill-current" viewBox="0 0 20 20">
          <path
            d="M5.293 7.293a1 1 0 011.414 0L10 10.586l3.293-3.293a1 1 0 111.414 1.414l-4 4a1 1 0 01-1.414 0l-4-4a1 1 0 010-1.414z" />
        </svg>
      </div>
    </div>
  </div>

  <div class="text-sm text-gray-500">
    Mostrando <span class="font-semibold text-gray-900">{{(pageNumber() - 1) * pageSize() + 1}}</span>
    al <span class="font-semibold text-gray-900">{{lastItemIndex()}}</span>
    de <span class="font-semibold text-gray-900">{{totalCount()}}</span> resultados
  </div>

  <div class="flex items-center gap-2">
    <button
      class="inline-flex items-center justify-center w-10 h-10 rounded-full border border-gray-300 bg-white text-gray-700 transition-all hover:bg-gray-50 hover:border-gray-400 disabled:opacity-40 disabled:cursor-not-allowed disabled:hover:bg-white"
      [disabled]="pageNumber() === 1" (click)="onPageChange(pageNumber() - 1)" title="Página anterior">
      <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7" />
      </svg>
    </button>

    <div class="flex items-center px-4 py-1.5 bg-gray-100 rounded-lg text-sm font-medium text-gray-700">
      {{pageNumber()}} / {{totalPages()}}
    </div>

    <button
      class="inline-flex items-center justify-center w-10 h-10 rounded-full border border-gray-300 bg-white text-gray-700 transition-all hover:bg-gray-50 hover:border-gray-400 disabled:opacity-40 disabled:cursor-not-allowed disabled:hover:bg-white"
      [disabled]="pageNumber() >= totalPages()" (click)="onPageChange(pageNumber() + 1)" title="Siguiente página">
      <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7" />
      </svg>
    </button>
  </div>
</div>
