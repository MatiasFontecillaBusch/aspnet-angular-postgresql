<div>
  <span class="block text-sm font-bold text-slate-700 mb-2 ml-1">Imagen del Producto</span>

  <div
    class="flex items-center gap-4 p-4 bg-slate-50 rounded-2xl border-2 border-dashed border-slate-200 transition-all hover:border-blue-400">

    @if (imagePreview()) {
    <div class="relative w-20 h-20 shrink-0">
      <img [src]="imagePreview()" class="w-full h-full object-cover rounded-xl border border-slate-200" alt="Preview" />
      <button type="button" (click)="removeImage()"
        class="absolute -top-1.5 -right-1.5 bg-rose-500 hover:bg-rose-600 text-white p-1 rounded-full shadow-md transition-all"
        title="Eliminar imagen">
        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M6 18L18 6M6 6l12 12" />
        </svg>
      </button>
    </div>
    } @else {
    <div
      class="w-20 h-20 bg-white rounded-xl border border-slate-200 flex items-center justify-center text-slate-400 shrink-0">
      <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"
          d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z" />
      </svg>
    </div>
    }

    <div class="flex-1 text-left">
      <label for="image-upload"
        class="inline-flex items-center gap-2 bg-white hover:bg-slate-100 text-slate-700 border border-slate-300 px-3 py-1.5 rounded-xl text-xs font-bold shadow-sm cursor-pointer transition-all">
        <svg class="w-4 h-4 text-slate-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12" />
        </svg>
        {{ imagePreview() ? 'Cambiar imagen' : 'Subir imagen' }}
      </label>
      <input id="image-upload" type="file" accept="image/*" class="hidden" (change)="onFileSelected($event)" />
      <p class="text-[11px] text-slate-400 mt-1">Soporta PNG, JPG o WEBP.</p>
    </div>

  </div>
</div>
